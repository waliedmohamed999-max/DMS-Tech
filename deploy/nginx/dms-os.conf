# DMS Business OS — TLS edge (Phase 10). Replace os.example.sa and the certificate paths (Let's Encrypt / provider).
upstream dms_os {
    least_conn;
    server 127.0.0.1:3100 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3101 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP → HTTPS (301); ACME challenge stays on port 80
server {
    listen 80;
    listen [::]:80;
    server_name os.example.sa;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name os.example.sa;

    ssl_certificate     /etc/letsencrypt/live/os.example.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.example.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # uploads: 10 MB documents + multipart overhead; webhooks are capped at 256 KB by the app
    client_max_body_size 11m;
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://dms_os;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # the app trusts the FIRST X-Forwarded-For entry for rate limits — overwrite, never append client values
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
    }
}
